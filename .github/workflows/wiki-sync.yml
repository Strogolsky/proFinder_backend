name: Wiki Sync

on:
  # docs/ -> Wiki
  push:
    branches: [ develop ]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-sync.yml'
  # Wiki -> docs/
  gollum:

defaults:
  run:
    shell: bash

permissions:
  contents: write

# -------------------------------------------------------------
jobs:
  docs-to-wiki:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs/ to Wiki
        uses: newrelic/wiki-sync-action@main
        with:
          source: docs
          destination: wiki
          token: ${{ secrets.WIKI_ACTION_TOKEN }}
          gitAuthorName: ${{ github.actor }}
          gitAuthorEmail: ${{ github.actor }}@users.noreply.github.com
  # -------------------------------------------------------------
  wiki-to-docs:
    if: github.event_name == 'gollum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WIKI_ACTION_TOKEN }}

      - name: Sync Wiki to docs/
        uses: newrelic/wiki-sync-action@main
        with:
          source: wiki
          destination: docs
          token: ${{ secrets.WIKI_ACTION_TOKEN }}
          branch: develop
          gitAuthorName: ${{ github.actor }}
          gitAuthorEmail: ${{ github.actor }}@users.noreply.github.com
          commitMessage: 'docs: sync from wiki'
